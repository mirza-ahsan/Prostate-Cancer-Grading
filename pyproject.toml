[project]
name = "prostate-cancer-grading"
version = "0.1.0"
description = "Prostate Cancer Grading Deep Learning & ML project"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.30.0",
    "imagecodecs>=2026.6.26",
    "imagehash>=4.3.2",
    "matplotlib>=3.11.0",
    "opencv-contrib-python-headless>=5.0.0.93",
    "openslide-bin>=4.0.1.2",
    "openslide-python>=1.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tifffile>=2026.7.14",
    "timm>=1.0.29",
    "torch",
    "torchaudio",
    "torchvision",
    "tqdm>=4.66.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B018"]

[tool.black]
line-length = 120

